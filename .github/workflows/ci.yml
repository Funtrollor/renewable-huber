name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust CPU core quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all -- --check
      - name: Check Rust workspace
        working-directory: native
        run: cargo check --locked --workspace --all-targets
      - name: Test Rust workspace
        working-directory: native
        # PyO3 extension crates are exercised by the native wheel jobs below.
        # Building them as standalone Linux test executables leaves CPython
        # extension-module symbols unresolved, so unit-test the pure Rust
        # crates here while retaining workspace-wide check and clippy gates.
        run: cargo test --locked -p rh-core -p rh-cpu -p rh-cuda-ffi --all-targets
      - name: Lint Rust workspace
        working-directory: native
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-msrv:
    name: Rust CPU core MSRV 1.83
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100
      - name: Check locked workspace at the declared MSRV
        working-directory: native
        run: cargo check --locked --workspace --all-targets

  native-cpu:
    name: Native CPU on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package and native build frontend
        run: python -m pip install ".[dev]" maturin
      - name: Build matching base wheel
        run: python -m build --wheel --outdir dist-base
      - name: Build native CPU wheel
        working-directory: native/python-cpu
        run: python -m maturin build --release --out ../../dist-native-cpu
      - name: Smoke-test matching wheels in a clean environment
        run: >-
          python scripts/native/smoke_test_cpu_wheels.py
          --base-dir dist-base
          --native-dir dist-native-cpu
      - name: Install native CPU wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist-native-cpu/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"
      - name: Run native CPU differential tests
        # The required profile fails outright when the extension is missing or
        # reports the wrong ABI, instead of passing as a suite of skips.
        # tests.test_native_golden forces backend="numpy", so it belongs to the
        # core profile and still runs on every baseline matrix entry.
        run: python scripts/run_test_profile.py native-cpu --verbose

  baseline:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Validate test profile membership
        # Catches a test module added without a profile, a typo, or an
        # accidental duplicate before any of it can silently stop running.
        run: python scripts/run_test_profile.py --check
      - name: Run required core profile
        run: python scripts/run_test_profile.py core --verbose
      - name: Run required performance profile
        run: python scripts/run_test_profile.py performance --verbose

  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Verify native-core golden corpus
        run: python scripts/generate_native_golden.py --check
      - name: Verify base/native release metadata contract
        run: python scripts/native/validate_release_artifacts.py --source-only
      - name: Verify CUDA C ABI struct layout
        # rh_cuda.h includes only <stdint.h>, so the layout static_asserts
        # compile without a GPU or a CUDA Toolkit. This is the cheapest place
        # to catch a real layout change; tests/test_native_cuda_contract.py
        # then checks that every language's mirror still agrees with it.
        run: >-
          g++ -std=c++17 -fsyntax-only -I native/cuda/include
          native/cuda/src/abi_contract.cpp

  optional-backend:
    name: ${{ matrix.name }} CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PyTorch
            extra: gpu-torch
            test-module: tests.test_torch_backend
          - name: TensorFlow
            extra: gpu-tensorflow
            test-module: tests.test_tensorflow_backend
          - name: scikit-learn
            extra: sklearn,pandas
            test-module: tests.test_sklearn_integration tests.test_data_integrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and ${{ matrix.name }}
        run: python -m pip install ".[dev,${{ matrix.extra }}]"
      - name: Run ${{ matrix.name }} backend tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m unittest ${{ matrix.test-module }} -v

  optional-cpu-profile:
    # The matrix above proves each optional framework works in isolation. This
    # job is what makes the `optional-cpu` required profile mean something:
    # with every optional CPU dependency installed, a missing one becomes a
    # failure rather than a skip.
    name: Optional CPU integrations (required profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and every optional CPU framework
        run: python -m pip install ".[dev,sklearn,pandas,gpu-torch,gpu-tensorflow]"
      - name: Run required optional CPU profile
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python scripts/run_test_profile.py optional-cpu --verbose

  package-smoke:
    name: Wheel and sdist smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Smoke-test wheel in a clean environment
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one wheel, found ${#artifacts[@]}"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "${artifacts[0]}"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import numpy as np; from renewable_huber import RenewableHuberRegressor, __version__; X = np.arange(8, dtype=float).reshape(4, 2); y = np.arange(4, dtype=float); model = RenewableHuberRegressor(max_iter=5).fit(X, y); assert __version__; assert model.predict(X).shape == (4,)"
          "$RUNNER_TEMP/wheel-smoke/bin/renewable-huber" --version
      - name: Smoke-test sdist in a clean environment
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.tar.gz)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one sdist, found ${#artifacts[@]}"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install "${artifacts[0]}"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-smoke/bin/python" -c "import numpy as np; from renewable_huber import RenewableHuberRegressor, __version__; X = np.arange(8, dtype=float).reshape(4, 2); y = np.arange(4, dtype=float); model = RenewableHuberRegressor(max_iter=5).fit(X, y); assert __version__; assert model.predict(X).shape == (4,)"
          "$RUNNER_TEMP/sdist-smoke/bin/renewable-huber" --version
