name: GPU validation

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref used as the fixed-runner A/B baseline
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  cupy-cuda:
    name: CuPy CUDA on self-hosted GPU
    # Deliberately manual: public pull requests must not execute arbitrary
    # contributor code on a self-hosted machine with access to a GPU.
    runs-on: [self-hosted, windows, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out the fixed-runner baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .gpu_test_packages/baseline-source
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Show CUDA device
        shell: pwsh
        run: nvidia-smi
      - name: Install CUDA backends and test tools
        run: python -m pip install ".[dev,gpu-cupy,gpu-torch,native-build]"
      - name: Verify base/native release metadata contract
        run: python scripts/native/validate_release_artifacts.py --source-only
      - name: Build matching base wheel
        run: python -m build --wheel --outdir dist-base
      - name: Build and run direct CUDA C ABI smoke test
        shell: pwsh
        run: |
          cmake -S native/cuda -B build/native-cuda-smoke `
            -G "Visual Studio 17 2022" -A x64 `
            -DRH_CUDA_BUILD_SHARED=OFF `
            -DRH_CUDA_BUILD_TESTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES=native
          cmake --build build/native-cuda-smoke --config Release --parallel
          ctest --test-dir build/native-cuda-smoke -C Release --output-on-failure
      - name: Build non-release native CUDA validation wheel
        working-directory: native/python-cuda
        env:
          RH_CUDA_ARCHITECTURES: native
        run: python -m maturin build --release --out ../../dist-native-cuda
      - name: Smoke-test matching CUDA wheels in a clean environment
        run: >-
          python scripts/native/smoke_test_cuda_wheels.py
          --base-dir dist-base
          --native-dir dist-native-cuda
      - name: Install native CUDA validation wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist-native-cuda/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall',
          '--no-deps', wheels[0]])"
      - name: Build and install candidate native CPU wheel
        working-directory: native/python-cpu
        run: python -m maturin build --release --out ../../dist-native-cpu
      - name: Install candidate native CPU wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist-native-cpu/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall',
          '--no-deps', wheels[0]])"
      - name: Run CUDA kernel, CuPy, and native integration tests
        run: >
          python -m unittest tests.test_cuda_kernels tests.test_cupy_backend
          tests.test_native_cuda_backend tests.test_dlpack_adapters -v
      - name: Capture CUDA shape-sweep smoke baseline
        run: >
          python scripts/benchmarks/benchmark_shape_sweep.py
          --profile smoke --backend both --penalty both --dtype both
          --warmup 1 --repeats 3
          --output artifacts/gpu-shape-sweep-smoke.json
      - name: Capture native CUDA shape-sweep smoke baseline
        run: >
          python scripts/benchmarks/benchmark_shape_sweep.py
          --profile smoke --backend native_cuda --penalty none --dtype both
          --warmup 1 --repeats 3
          --output artifacts/native-p2-shape-sweep-smoke.json
      - name: Capture NVTX workload metadata
        run: >
          python scripts/profiling/profile_cuda_update.py
          --samples 8192 --features 32 --batch-size 4096
          --warmup 1 --repeats 1
          --metadata-output artifacts/gpu-profile-smoke.json
      - name: Capture native CUDA NVTX workload metadata
        run: >
          python scripts/profiling/profile_cuda_update.py
          --engine native_cuda --input-location host --penalty none
          --samples 8192 --features 32 --batch-size 4096
          --warmup 1 --repeats 1
          --metadata-output artifacts/native-p2-profile-smoke.json
      - name: Build isolated baseline CPU and CUDA engines
        shell: pwsh
        run: |
          $baselineRoot = (Resolve-Path ".gpu_test_packages/baseline-source").Path
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $baselineEnv = Join-Path $env:RUNNER_TEMP "renewable-huber-baseline-$runSuffix"
          python -m venv $baselineEnv
          $baselinePython = Join-Path $baselineEnv "Scripts/python.exe"
          & $baselinePython -m pip install --upgrade pip
          & $baselinePython -m pip install -e "${baselineRoot}[dev,gpu-cupy,native-build]"

          $cpuOut = Join-Path $env:RUNNER_TEMP "baseline-native-cpu-$runSuffix"
          Push-Location (Join-Path $baselineRoot "native/python-cpu")
          & $baselinePython -m maturin build --release --out $cpuOut
          Pop-Location
          $cpuWheel = @(Get-ChildItem $cpuOut -Filter "*.whl")
          if ($cpuWheel.Count -ne 1) { throw "expected one baseline CPU wheel" }
          & $baselinePython -m pip install --force-reinstall --no-deps $cpuWheel[0].FullName

          $cudaOut = Join-Path $env:RUNNER_TEMP "baseline-native-cuda-$runSuffix"
          $env:RH_CUDA_ARCHITECTURES = "native"
          Push-Location (Join-Path $baselineRoot "native/python-cuda")
          & $baselinePython -m maturin build --release --out $cudaOut
          Pop-Location
          $cudaWheel = @(Get-ChildItem $cudaOut -Filter "*.whl")
          if ($cudaWheel.Count -ne 1) { throw "expected one baseline CUDA wheel" }
          & $baselinePython -m pip install --force-reinstall --no-deps $cudaWheel[0].FullName
      - name: Gate CPU and CUDA with interleaved baseline/candidate pairs
        shell: pwsh
        run: |
          $baselineRoot = (Resolve-Path ".gpu_test_packages/baseline-source").Path
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $baselinePython = Join-Path $env:RUNNER_TEMP `
            "renewable-huber-baseline-$runSuffix/Scripts/python.exe"
          $candidatePython = (Get-Command python).Source
          & $candidatePython scripts/benchmarks/run_interleaved_benchmark.py `
            --baseline-python $baselinePython `
            --baseline-repo $baselineRoot `
            --candidate-python $candidatePython `
            --candidate-repo . `
            --output-dir artifacts/interleaved `
            --rounds 9 --profile smoke --backend all --penalty none --dtype both `
            --lifecycle cold --operation partial-fit --warmup 1 `
            --minimum-sample-seconds 0.25 --max-sample-repetitions 16
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-p2-validation
          path: artifacts/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-runner-interleaved-regression
          path: artifacts/interleaved/**/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: nonrelease-native-cuda-validation-wheel
          path: dist-native-cuda/*.whl
