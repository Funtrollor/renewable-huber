name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    name: Validate source release
    if: github.repository == 'Funtrollor/renewable-huber'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Require the current main release commit
        shell: bash
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require tag, base, and native package versions to match
        shell: bash
        run: |
          package_version="$(python -c "import runpy; print(runpy.run_path('src/renewable_huber/_version.py')['__version__'])")"
          if test "$GITHUB_REF_TYPE" = "tag"; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$package_version"
          fi
          python scripts/native/validate_release_artifacts.py --source-only
      - name: Install validation tools
        run: python -m pip install ".[dev]" twine
      - name: Run Python tests and quality gates
        run: |
          python scripts/run_test_profile.py --check
          python scripts/run_test_profile.py core --verbose
          python scripts/run_test_profile.py performance --verbose
          python -m unittest discover -s tests -v
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Run Rust tests and quality gates
        working-directory: native
        run: |
          cargo fmt --all -- --check
          # PyO3 extensions are validated by the wheel jobs; standalone Linux
          # test executables cannot resolve extension-module CPython symbols.
          cargo test --locked -p rh-core -p rh-cpu -p rh-cuda-ffi --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build base wheel and sdist
        run: python -m build --outdir dist-base
      - name: Validate base distribution metadata
        run: python -m twine check dist-base/*
      - name: Clean-install base wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/base-release-smoke"
          "$RUNNER_TEMP/base-release-smoke/bin/python" -m pip install dist-base/*.whl
          "$RUNNER_TEMP/base-release-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/base-release-smoke/bin/renewable-huber" --version
      - name: Clean-install base sdist
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/base-sdist-smoke"
          "$RUNNER_TEMP/base-sdist-smoke/bin/python" -m pip install dist-base/*.tar.gz
          "$RUNNER_TEMP/base-sdist-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/base-sdist-smoke/bin/renewable-huber" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-distributions
          path: dist-base/*
          if-no-files-found: error
          retention-days: 30

  native-cpu-wheels:
    name: CPU wheel / ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: source-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            architecture: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            architecture: linux-aarch64
            rust-target: aarch64-unknown-linux-gnu
          - os: windows-latest
            architecture: windows-x86_64
          - os: macos-15-intel
            architecture: macos-x86_64
          - os: macos-15
            architecture: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install native build frontend
        if: runner.os != 'Linux'
        run: python -m pip install "maturin>=1.8,<2"
      - name: Validate matching package metadata
        run: python scripts/native/validate_release_artifacts.py --source-only
      - name: Build manylinux2014 CPU wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.rust-target }}
          args: >-
            --release --locked
            --interpreter python${{ matrix.python-version }}
            --out ../../dist-native-cpu
          manylinux: "2014"
          working-directory: native/python-cpu
      - name: Build native CPU wheel
        if: runner.os != 'Linux'
        working-directory: native/python-cpu
        run: >-
          python -m maturin build --release --locked
          --out ../../dist-native-cpu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-distributions
          path: dist-base
      - name: Clean-install matching base and CPU wheels
        run: >-
          python scripts/native/smoke_test_cpu_wheels.py
          --base-dir dist-base --native-dir dist-native-cpu
      - name: Run required native CPU profile against the release wheel
        shell: bash
        run: |
          python -m pip install ".[dev]"
          python -m pip install dist-native-cpu/*.whl
          python scripts/run_test_profile.py native-cpu --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cpu-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist-native-cpu/*.whl
          if-no-files-found: error
          retention-days: 30

  native-cuda-wheels:
    name: CUDA 12 wheel / Windows x86-64 / py${{ matrix.python-version }}
    needs: source-gate
    # This job compiles and inspects wheels without requiring a GPU. Runtime
    # correctness and performance remain local-only on the fixed GPU host.
    # CUDA 12.9 supports Visual Studio through 2022. Pin this image because
    # windows-latest moved to Visual Studio 2026 in June 2026.
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Fat binary policy: SASS for Turing through Blackwell, plus PTX only for
      # the highest entry. CUDA 12.8+ is required to compile SM 120.
      RH_CUDA_ARCHITECTURES: "75-real;80-real;86-real;89-real;90-real;120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CUDA 12.9 release toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          # FindCUDAToolkit models cuSOLVER as depending on cuBLAS/cuBLASLt and
          # cuSPARSE. cuSPARSE loads nvJitLink at runtime. NVIDIA ships runtime
          # and development files separately, so keep the complete closure
          # explicit. cuBLASLt ships inside the cuBLAS packages.
          sub-packages: '["nvcc", "cuobjdump", "cudart", "cublas", "cublas_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "nvjitlink", "visual_studio_integration"]'
          log-file-suffix: py${{ matrix.python-version }}
      - name: Verify CUDA dev component installation
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) {
            throw "Jimver/cuda-toolkit did not export CUDA_PATH."
          }
          $cudaPath = $env:CUDA_PATH
          Write-Host "CUDA Path: $cudaPath"

          $requiredFiles = @(
            "include\cuda_runtime.h",
            "include\cublas_v2.h",
            "include\cublasLt.h",
            "include\cusolverDn.h",
            "include\cusparse.h",
            "lib\x64\cudart.lib",
            "lib\x64\cublas.lib",
            "lib\x64\cublaslt.lib",
            "lib\x64\cusolver.lib",
            "lib\x64\cusparse.lib",
            "bin\cudart64_12.dll",
            "bin\cublas64_12.dll",
            "bin\cublasLt64_12.dll",
            "bin\cusolver64_11.dll",
            "bin\cusparse64_12.dll",
            "bin\nvJitLink_120_0.dll",
            "bin\cuobjdump.exe"
          )
          $missingFiles = @(
            foreach ($relativePath in $requiredFiles) {
              $path = Join-Path $cudaPath $relativePath
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                Write-Host "Found: $relativePath"
              } else {
                $relativePath
              }
            }
          )
          if ($missingFiles.Count -gt 0) {
            throw "CUDA 12.9 development installation is incomplete: $($missingFiles -join ', ')"
          }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Show CUDA release toolchain
        shell: pwsh
        run: |
          $output = nvcc --version | Out-String
          Write-Host $output
          if ($output -notmatch 'release\s+(\d+)\.(\d+)') {
            throw "Unable to parse the CUDA Toolkit version from nvcc."
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          if ($major -lt 12 -or ($major -eq 12 -and $minor -lt 8)) {
            throw "CUDA Toolkit 12.8 or newer is required for SM 120 release wheels."
          }
      - name: Install release build tools
        run: python -m pip install ".[native-build]" twine
      - name: Build CUDA 12 plugin wheel
        shell: pwsh
        run: >-
          .\scripts\native\build_native_cuda.ps1
          -Python "${{ env.pythonLocation }}\python.exe"
          -OutputDirectory "dist-native-cuda"
          -NoInstall
      - name: Verify CUDA wheel architecture payload
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem "dist-native-cuda\*.whl")
          if ($wheel.Count -ne 1) {
            throw "Expected one CUDA wheel, found $($wheel.Count)."
          }
          $inspection = Join-Path $env:RUNNER_TEMP "cuda-wheel-inspection"
          New-Item -ItemType Directory -Path $inspection -Force | Out-Null
          python -m zipfile -e $wheel[0].FullName $inspection
          $extensions = @(Get-ChildItem $inspection -Recurse -Filter "*.pyd")
          if ($extensions.Count -ne 1) {
            throw "Expected one CUDA extension, found $($extensions.Count)."
          }
          $sass = cuobjdump --list-elf $extensions[0].FullName | Out-String
          foreach ($architecture in 75, 80, 86, 89, 90, 120) {
            if ($sass -notmatch "sm_$architecture\.cubin") {
              throw "CUDA wheel is missing SM $architecture SASS."
            }
          }
          $ptx = cuobjdump --list-ptx $extensions[0].FullName | Out-String
          $ptxArchitectures = @(
            [regex]::Matches($ptx, "(?:compute|sm)_(\d+)\.ptx") |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique
          )
          if (($ptxArchitectures.Count -ne 1) -or ($ptxArchitectures[0] -ne "120")) {
            throw "Expected PTX only for architecture 120; found: $($ptxArchitectures -join ', ')."
          }
      - name: Validate CUDA wheel metadata
        run: python -m twine check dist-native-cuda/*
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-distributions
          path: dist-base
      - name: Clean-install and import CUDA wheel without a GPU
        run: >-
          python scripts/native/smoke_test_cuda_wheels.py
          --base-dir dist-base --native-dir dist-native-cuda --import-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cuda-windows-x86_64-py${{ matrix.python-version }}
          path: dist-native-cuda/*.whl
          if-no-files-found: error
          retention-days: 30

  validate-release-set:
    name: Validate complete artifact set
    needs: [source-gate, native-cpu-wheels, native-cuda-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-distributions
          path: release/base
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-cpu-*
          path: release/cpu
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-cuda-*
          path: release/cuda
          merge-multiple: true
      - name: Validate versions, dependencies, modules, and artifact counts
        run: >-
          python scripts/native/validate_release_artifacts.py
          --base-dir release/base --cpu-dir release/cpu --cuda-dir release/cuda
          --expected-cpu 15 --expected-cuda 3
      - name: Validate all distribution metadata
        run: |
          python -m pip install twine
          python -m twine check release/base/* release/cpu/* release/cuda/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-release-bundle
          path: release/**/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: validate-release-set
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: complete-release-bundle
          path: release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t artifacts < <(find release -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
              --verify-tag --generate-notes --notes-start-tag v0.5.1 \
              --title "renewable-huber $GITHUB_REF_NAME"
          fi

  publish-base:
    name: Publish base package to PyPI
    needs: github-release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/renewable-huber
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  publish-native-cpu:
    name: Publish native CPU wheels to PyPI
    # Native wheels declare an exact dependency on the base release. Publish
    # that project first so installers never observe a plugin whose required
    # base version is still absent from the index.
    needs: [github-release, publish-base]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi-native-cpu
      url: https://pypi.org/p/renewable-huber-native-cpu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-cpu-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  publish-native-cuda:
    name: Publish native CUDA wheels to PyPI
    needs: [github-release, publish-base]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi-native-cuda
      url: https://pypi.org/p/renewable-huber-native-cuda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-cuda-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
