[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "renewable-huber-native-cuda"
version = "0.1.0"
description = "Optional Rust/CUDA native engine for renewable-huber."
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.maturin]
manifest-path = "crates/rh-python/Cargo.toml"
features = ["cuda"]
