[workspace]
members = [
  "crates/rh-core",
  "crates/rh-cpu",
  "crates/rh-cuda-ffi",
  "crates/rh-python-cpu",
  "crates/rh-python-cuda",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/Funtrollor/renewable-huber"

[workspace.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
numpy = "0.29"
num-traits = "0.2"
# Dev-only. Pinned below 1.10, whose rust-version (1.84) exceeds the workspace
# MSRV; the rust-msrv CI job checks every target, tests included, at 1.83.
# Without `fork`/`timeout` there is no subprocess runner and no tempfile.
proptest = { version = "~1.9", default-features = false, features = ["std"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
thiserror = "2.0"
