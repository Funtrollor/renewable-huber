[workspace]
members = [
  "crates/rh-cuda-ffi",
  "crates/rh-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/Funtrollor/renewable-huber"

[workspace.dependencies]
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }
thiserror = "2.0"
