[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "renewable-huber-native-cpu"
version = "0.1.0"
description = "Optional Rust CPU engine for renewable-huber."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Renewable Huber contributors" }]
dependencies = ["renewable-huber>=0.6.0,<0.7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Documentation = "https://github.com/Funtrollor/renewable-huber/blob/main/docs/native-core-p1.md"
Issues = "https://github.com/Funtrollor/renewable-huber/issues"
Source = "https://github.com/Funtrollor/renewable-huber"

[tool.maturin]
manifest-path = "../crates/rh-python-cpu/Cargo.toml"
module-name = "_renewable_huber_native_cpu"
strip = true
