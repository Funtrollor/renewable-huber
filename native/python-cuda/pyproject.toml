[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "renewable-huber-native-cuda"
version = "0.7.0"
description = "Optional Rust/CUDA 12 native engine for renewable-huber."
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Renewable Huber contributors" }]
# The CUDA 12 runtime closure the extension loads, from NVIDIA's own wheels.
# Floors are the CUDA 12.9 components the release is compiled against; the
# -cu12 package names keep every install on the CUDA 12 major version.
dependencies = [
  "renewable-huber==0.7.0",
  "nvidia-cuda-runtime-cu12>=12.9",
  "nvidia-cublas-cu12>=12.9",
  "nvidia-cusolver-cu12>=11.7.5",
  "nvidia-cusparse-cu12>=12.5.10",
  "nvidia-nvjitlink-cu12>=12.9",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Documentation = "https://funtrollor.github.io/renewable-huber/native-core-p2/"
Issues = "https://github.com/Funtrollor/renewable-huber/issues"
Source = "https://github.com/Funtrollor/renewable-huber"

[tool.maturin]
manifest-path = "../crates/rh-python-cuda/Cargo.toml"
module-name = "_renewable_huber_native_cuda"
features = ["cuda"]
strip = true
