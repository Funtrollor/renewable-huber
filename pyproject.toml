[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "renewable-huber"
dynamic = ["version"]
description = "Renewable Huber regression for robust streaming-data estimation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Renewable Huber contributors" }]
keywords = ["robust-regression", "streaming-data", "huber", "online-learning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.3"]
gpu-cupy = ["cupy-cuda12x>=13"]
gpu-torch = ["torch>=2.2"]
gpu-tensorflow = ["tensorflow>=2.16"]
native-build = ["maturin>=1.8,<2"]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.4",
  "mypy>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
# MkDocs site (mkdocs.yml). mkdocstrings reads src/ statically, so building the
# site needs neither native extension; ruff only formats rendered signatures.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=1.0,<2",
  "ruff>=0.8",
]

[project.urls]
Changelog = "https://github.com/Funtrollor/renewable-huber/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Funtrollor/renewable-huber#readme"
Issues = "https://github.com/Funtrollor/renewable-huber/issues"
Source = "https://github.com/Funtrollor/renewable-huber"

[project.scripts]
renewable-huber = "renewable_huber.cli:main"

[tool.hatch.version]
path = "src/renewable_huber/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/renewable_huber"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/renewable_huber",
  "/tests",
  "/docs/*.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/.gpu_test_packages/**",
  "/.venv/**",
  "/archives/**",
  "/data/**",
  "/dist/**",
  "/legacy/**",
  "/models/**",
  "/notebooks/**",
  "/scripts/**",
  "/docs/references/**",
  "/docs/reports/**",
  # Site-only pages assembled from README.en.md and other files by the MkDocs
  # snippets extension; they are unreadable on their own. docs/*/ pages are
  # already outside the non-recursive "/docs/*.md" include.
  "/docs/index.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Type checking level: every default mypy check plus `check_untyped_defs`, the
# redundancy warnings and explicit-Optional enforcement. Deliberately *not*
# `--strict`: that would additionally demand annotations on every function and
# forbid `Any` leaking from NumPy/array-API values, which here means rewriting
# backend signatures rather than finding bugs. Third-party libraries that are
# optional extras, and the separately built native extensions, are exempted
# per module below; nothing is ignored globally.
#
# python_version is 3.12, the CI quality job's interpreter, not the 3.10 floor:
# NumPy 2.5+ ships stubs written with PEP 695 `type` statements, which mypy
# refuses to parse for an older target. 3.10 syntax is enforced by ruff's
# target-version and 3.10 runtime behaviour by the baseline matrix.
[tool.mypy]
python_version = "3.12"
files = ["src/renewable_huber"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
  "_renewable_huber_native_cpu",
  "_renewable_huber_native_cuda",
  "cupy",
  "cupyx",
  "sklearn.*",
  "tensorflow",
  "threadpoolctl",
  "torch",
]
ignore_missing_imports = true

# Measured by the CI `quality` job over the required `core` profile only, so
# the native extensions, GPU backends and optional frameworks it cannot import
# there count as uncovered. `fail_under` guards against regressions in that
# measurement; it is not a target.
[tool.coverage.run]
source = ["renewable_huber"]
branch = true

[tool.coverage.report]
fail_under = 72
show_missing = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '^\s*\.\.\.\s*$',
]
